services:
  db:
    image: postgres:16-alpine
    container_name: dealflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealflow
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d dealflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Group B addition: Redis for Celery broker and result backend
  redis:
    image: redis:7-alpine
    container_name: dealflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Group B addition: Celery worker for async backorder consolidation
  celery-worker:
    build: ./backend
    container_name: dealflow-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    working_dir: /app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
